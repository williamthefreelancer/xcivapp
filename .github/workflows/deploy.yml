# Deploy the Super Ninety Four theme to DreamHost (superninetyfour.com).
# Source: wp-content/themes/super-ninety-four/
# Dest:   secrets.DREAMHOST_THEME_PATH
#
# Trailing slash on the local path syncs *contents* into the remote theme
# folder (avoids nested super-ninety-four/super-ninety-four/).
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   DREAMHOST_HOST        vps72256.dreamhostps.com
#   DREAMHOST_USERNAME    superxcivapp
#   DREAMHOST_SSH_KEY     Private key (public key in ~/.ssh/authorized_keys)
#   DREAMHOST_THEME_PATH  /home/superxcivapp/superninetyfour.com/wp-content/themes/super-ninety-four

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "wp-content/themes/super-ninety-four/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: wp-content/themes/super-ninety-four/package-lock.json

      - name: Setup PHP / Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Build theme assets
        working-directory: wp-content/themes/super-ninety-four
        run: |
          set -euo pipefail
          composer install --no-dev --optimize-autoloader --no-interaction
          npm ci
          npm run build
          test -f dist/main.css
          test -f dist/main.js
          test -f vendor/autoload.php

      - name: Validate secrets
        env:
          DREAMHOST_HOST: ${{ secrets.DREAMHOST_HOST }}
          DREAMHOST_USERNAME: ${{ secrets.DREAMHOST_USERNAME }}
          DREAMHOST_SSH_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
          DREAMHOST_THEME_PATH: ${{ secrets.DREAMHOST_THEME_PATH }}
        run: |
          set -euo pipefail
          for name in DREAMHOST_HOST DREAMHOST_USERNAME DREAMHOST_SSH_KEY DREAMHOST_THEME_PATH; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: ${name}"
              exit 1
            fi
          done
          if [[ "${DREAMHOST_USERNAME}" != "superxcivapp" ]]; then
            echo "DREAMHOST_USERNAME should be superxcivapp (got: ${DREAMHOST_USERNAME})"
            exit 1
          fi
          if [[ "${DREAMHOST_THEME_PATH}" != /* ]]; then
            echo "DREAMHOST_THEME_PATH must be absolute (e.g. /home/superxcivapp/superninetyfour.com/wp-content/themes/super-ninety-four)"
            exit 1
          fi
          if [[ "${DREAMHOST_THEME_PATH}" == */super-ninety-four/super-ninety-four ]]; then
            echo "DREAMHOST_THEME_PATH looks nested. Use .../themes/super-ninety-four once."
            exit 1
          fi

      - name: Configure SSH
        env:
          DREAMHOST_HOST: ${{ secrets.DREAMHOST_HOST }}
          DREAMHOST_SSH_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${DREAMHOST_SSH_KEY}" > ~/.ssh/dreamhost_deploy
          chmod 600 ~/.ssh/dreamhost_deploy
          ssh-keyscan -H "${DREAMHOST_HOST}" >> ~/.ssh/known_hosts

      - name: Sync theme to DreamHost
        env:
          DREAMHOST_HOST: ${{ secrets.DREAMHOST_HOST }}
          DREAMHOST_USERNAME: ${{ secrets.DREAMHOST_USERNAME }}
          DREAMHOST_THEME_PATH: ${{ secrets.DREAMHOST_THEME_PATH }}
        run: |
          set -euo pipefail
          remote_theme="${DREAMHOST_THEME_PATH%/}"
          echo "User:   superxcivapp"
          echo "Local:  wp-content/themes/super-ninety-four/"
          echo "Remote: ${DREAMHOST_USERNAME}@${DREAMHOST_HOST}:${remote_theme}/"

          # Trailing slash on source = contents only (prevents duplicate folder nesting).
          rsync -avz --delete \
            -e "ssh -i ${HOME}/.ssh/dreamhost_deploy -o IdentitiesOnly=yes -o BatchMode=yes" \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'resources/' \
            --exclude 'bin/build-islands.mjs' \
            "./wp-content/themes/super-ninety-four/" \
            "${DREAMHOST_USERNAME}@${DREAMHOST_HOST}:${remote_theme}/"
